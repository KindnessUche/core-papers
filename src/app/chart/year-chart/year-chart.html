<figure class="chart">
  <figcaption class="head">
    <h3 class="title">Papers by year</h3>
    <p class="sub">
      Counted across all <span class="num">{{ total() | number }}</span>
      {{ total() === 1 ? 'paper' : 'papers' }} that match.
      @if (skipped()) {
        <span class="num">{{ skipped() | number }}</span> without a usable year
        {{ skipped() === 1 ? 'is' : 'are' }} left out.
      }
    </p>
  </figcaption>

  @if (bins().length === 0) {
    <p class="none">None of the matching papers have a publication year, so there is nothing to chart.</p>
  } @else {
    <div class="tools" role="toolbar" aria-label="Chart zoom">
      <div class="tool-group" role="group" aria-label="Years">
        <span class="tool-name">Years</span>
        <button type="button" class="tool" aria-label="Zoom in on years" [disabled]="!canZoomInX()" (click)="zoomX(1)">+</button>
        <button type="button" class="tool" aria-label="Zoom out on years" [disabled]="!canZoomOutX()" (click)="zoomX(-1)">−</button>
        <button type="button" class="tool" aria-label="Move to earlier years" [disabled]="!canPan()" (click)="pan(-1)">←</button>
        <button type="button" class="tool" aria-label="Move to later years" [disabled]="!canPan()" (click)="pan(1)">→</button>
      </div>
      <div class="tool-group" role="group" aria-label="Bar height">
        <span class="tool-name">Height</span>
        <button type="button" class="tool" aria-label="Make bars taller" [disabled]="!canZoomInY()" (click)="zoomY(1)">+</button>
        <button type="button" class="tool" aria-label="Make bars shorter" [disabled]="yZoom() === 1" (click)="zoomY(-1)">−</button>
      </div>
      <button type="button" class="tool reset" [disabled]="!zoomed()" (click)="reset()">Reset view</button>
      <p class="hint" aria-live="polite">
        @if (zoomed()) {
          Showing <span class="num">{{ viewLabel() }}</span>@if (yZoom() > 1) {, bars {{ yZoom() }}× taller}.
        } @else {
          Drag across the chart to zoom in.
        }
      </p>
    </div>

    <div
      #frame
      class="plot"
      role="group"
      tabindex="0"
      [attr.aria-label]="summary()"
      (keydown)="onKey($event)"
      (blur)="active.set(null)"
      (pointerleave)="active.set(null)"
      (pointerdown)="dragStart($event)"
      (pointermove)="dragMove($event)"
      (pointerup)="dragEnd()"
      (pointercancel)="selection.set(null)"
    >
      <svg class="svg" [attr.width]="width()" [attr.height]="height" aria-hidden="true">
        @for (tick of ticks(); track tick.value) {
          <line
            class="grid"
            [attr.x1]="margin.left"
            [attr.x2]="width() - margin.right"
            [attr.y1]="tick.y"
            [attr.y2]="tick.y"
          />
          <text class="tick num" [attr.x]="margin.left - 8" [attr.y]="tick.y + 4" text-anchor="end">
            {{ tick.value }}
          </text>
        }

        @for (bar of bars(); track bar.bin.start; let i = $index) {
          @if (bar.bin.count > 0) {
            <path
              class="bar"
              [class.peak]="i === peak()"
              [class.dim]="active() !== null && active() !== i"
              [attr.d]="bar.path"
              [style.--i]="i"
              [style.transform-origin]="'0 ' + baseline + 'px'"
            />
            @if (bar.clipped) {
              <!-- A cut through the top says this bar is taller than the axis; the tooltip has the real value -->
              <rect class="notch" [attr.x]="bar.notchX" [attr.y]="bar.y + 5" [attr.width]="bar.notchW" height="2" />
            }
          }
        }

        @if (bars()[peak()]; as top) {
          @if (active() === null) {
            <text class="peak-label num" [attr.x]="top.bandX + band() / 2" [attr.y]="top.y - 7" text-anchor="middle">
              {{ top.bin.count }}
            </text>
          }
        }

        @if (selectionRect(); as sel) {
          <rect class="selection" [attr.x]="sel.x" [attr.y]="margin.top" [attr.width]="sel.width" [attr.height]="innerH" />
        }

        @for (label of labels(); track label.i) {
          <text class="tick" [attr.x]="label.x" [attr.y]="height - 8" text-anchor="middle">{{ label.text }}</text>
        }

        <!-- Hit areas span the whole slot and height, far bigger than the bars themselves -->
        @for (bar of bars(); track bar.bin.start; let i = $index) {
          <rect
            class="hit"
            [attr.x]="bar.bandX"
            [attr.y]="margin.top"
            [attr.width]="band()"
            [attr.height]="innerH"
            (pointermove)="active.set(i)"
            (pointerdown)="active.set(i)"
          />
        }
      </svg>

      @if (tooltip(); as tip) {
        <div class="tip" role="status" [style.left.px]="tip.left" [style.top.px]="tip.top">
          <strong class="tip-value num">{{ tip.bin.count }}</strong>
          <span class="tip-name">{{ tip.bin.count === 1 ? 'paper' : 'papers' }}</span>
          <span class="tip-range num">{{ tip.bin.range }}</span>
        </div>
      }
    </div>

    <details class="table-view">
      <summary>View as table</summary>
      <table>
        <thead>
          <tr>
            <th scope="col">Years</th>
            <th scope="col" class="right">Papers</th>
          </tr>
        </thead>
        <tbody>
          @for (bin of bins(); track bin.start) {
            <tr>
              <th scope="row" class="num">{{ bin.range }}</th>
              <td class="num right">{{ bin.count }}</td>
            </tr>
          }
        </tbody>
      </table>
    </details>
  }
</figure>
