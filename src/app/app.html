<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Marginalia home">
      <span class="brand-mark" aria-hidden="true"></span>
      Marginalia
    </a>
    <p class="topbar-note">Open research, via CORE</p>
  </div>
</header>

<main class="stage">
  <section class="hero" aria-labelledby="hero-title">
    <p class="eyebrow reveal" style="--i: 0">Open-access research</p>
    <h1 id="hero-title" class="display reveal" style="--i: 1">
      Read what the world <em>has found out.</em>
    </h1>
    <p class="lede reveal" style="--i: 2">
      Search millions of open research papers with boolean queries, then see the shape of a
      field at a glance.
    </p>
  </section>

  <section class="empty reveal" style="--i: 3" aria-label="Results">
    <p class="empty-title">Nothing on the desk yet</p>
    <p class="empty-hint">Your results will appear here.</p>
  </section>
</main>
